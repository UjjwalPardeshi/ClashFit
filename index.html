<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ClashFit — prototype</title>
<style>
  :root{
    --ground:#07090C; --surface:#10141B; --lift:#1A2029;
    --ink:#F2F5F8; --mute:#8A94A4; --line:#222A35;
    --damage:#FF3B5C; --clean:#22D3A0; --shallow:#F5A524;
    --system:#38BDF8; --fatigue:#A78BFA;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --sans:ui-sans-serif,system-ui,'Segoe UI',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block}
  video{display:none}

  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

  /* top-left status */
  #status{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
  #cue{font-size:20px;font-weight:600;letter-spacing:-.01em;max-width:22ch;line-height:1.25;
       text-shadow:0 2px 18px rgba(0,0,0,.9)}
  #phase{display:inline-flex;align-items:center;gap:7px}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}

  /* bottom HUD */
  #hud{position:fixed;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;
       justify-content:space-between;gap:16px;z-index:3;pointer-events:none}
  .tile{background:rgba(16,20,27,.82);border:1px solid var(--line);padding:10px 16px;
        backdrop-filter:blur(8px);min-width:104px}
  .big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #verdict{font-size:22px;font-weight:800;letter-spacing:.06em}
  #pips{display:flex;gap:5px;margin:7px 0 4px}
  .pip{width:26px;height:7px;background:rgba(255,255,255,.14)}
  .pip.on{background:var(--fatigue)}

  /* controls */
  #ctl{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;
       align-items:flex-end;z-index:4}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button,select{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--system)}
  button:disabled{opacity:.4;cursor:default}
  button.on{border-color:var(--damage);color:var(--damage)}
  button.go{border-color:var(--clean);color:var(--clean)}
  select{text-transform:none;letter-spacing:0}
  :focus-visible{outline:2px solid var(--system);outline-offset:2px}

  /* debug */
  #dbg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
       background:rgba(16,20,27,.9);border:1px solid var(--line);padding:10px 14px;
       font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--mute);
       display:none;z-index:3;white-space:pre;min-width:340px}
  #dbg b{color:var(--ink);font-weight:600}
  #dbg.show{display:block}

  /* race bar */
  #race{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(520px,60vw);
        display:none;z-index:3}
  #race.show{display:block}
  #raceBar{height:10px;background:var(--fatigue);border:1px solid var(--line);margin-top:6px;
           overflow:hidden}
  #raceFill{display:block;height:100%;background:var(--clean);width:50%;transition:width .25s ease}

  /* result overlay */
  #over{position:fixed;inset:0;display:none;place-items:center;text-align:center;z-index:8;
        background:rgba(7,9,12,.86);backdrop-filter:blur(6px)}
  #over.show{display:grid}
  #overTitle{font-size:clamp(38px,7vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1;
             margin:10px 0 12px}
  #overBody{font-size:13px;letter-spacing:.1em;line-height:2}

  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);z-index:9;
        text-align:center;padding:24px}
  #boot h1{font-size:13px;font-family:var(--mono);letter-spacing:.28em;text-transform:uppercase;
           color:var(--mute);margin:0 0 14px}
  #boot p{color:var(--mute);font-size:14px;max-width:44ch;line-height:1.6;margin:0 0 20px}
  #err{color:var(--damage);font-family:var(--mono);font-size:12px;max-width:60ch;line-height:1.7}
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="cam" playsinline muted></video>

  <div id="status">
    <span id="phase" class="lbl"><i id="dot"></i><span id="phaseText">idle</span></span>
    <div id="cue">Press Start camera.</div>
  </div>

  <div id="ctl">
    <div class="row">
      <select id="exercise" title="Exercise"></select>
      <button id="start" class="go">Start camera</button>
    </div>
    <div class="row">
      <select id="mode" title="Mode">
        <option value="BOSS_FIGHT">Boss Fight</option>
        <option value="TIME_ATTACK">Time Attack · 60s</option>
        <option value="GHOST_RACE">Ghost Race</option>
      </select>
      <select id="ghost" title="Ghost" style="display:none"></select>
      <button id="saveGhost" title="Save this run as a ghost">Save ghost</button>
    </div>
    <div class="row">
      <button id="casual">Casual</button>
      <button id="reset">Reset fight</button>
      <button id="reload">Reload config</button>
    </div>
    <div class="row">
      <button id="rec">● Record trace</button>
      <button id="dl" disabled>Download</button>
      <button id="dbgBtn">Debug</button>
    </div>
  </div>

  <div id="race">
    <div class="lbl" style="display:flex;justify-content:space-between">
      <span id="raceYou" style="color:var(--clean)">YOU 0</span>
      <span id="raceThem" style="color:var(--fatigue)">0 GHOST</span>
    </div>
    <div id="raceBar"><i id="raceFill"></i></div>
  </div>

  <div id="hud">
    <div class="tile" id="timerTile" style="display:none">
      <div class="lbl">Time</div>
      <div class="big" id="timer">60</div>
    </div>
    <div class="tile">
      <div class="lbl">Reps</div>
      <div class="big" id="reps">0</div>
    </div>
    <div class="tile">
      <div class="lbl">Fatigue</div>
      <div id="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="lbl" id="band" style="color:var(--fatigue)">FRESH</div>
    </div>
    <div class="tile">
      <div class="lbl">Last rep</div>
      <div id="verdict" style="color:var(--mute)">—</div>
    </div>
    <div class="tile">
      <div class="lbl">Combo</div>
      <div class="big" id="combo">×1.0</div>
    </div>
  </div>

  <div id="over">
    <div>
      <div class="lbl" id="overKicker">Result</div>
      <div id="overTitle">—</div>
      <div id="overBody" class="lbl"></div>
      <button id="again" class="go" style="margin-top:18px">Run it again</button>
    </div>
  </div>

  <div id="dbg"></div>

  <div id="boot">
    <div>
      <h1>ClashFit · prototype</h1>
      <p>Throwaway prototype for threshold tuning and the Phase&nbsp;1 video.
         Rewritten from scratch at check-in.</p>
      <p id="err"></p>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
