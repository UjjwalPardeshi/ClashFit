# ClashFit Android CI. Lives in android/ci/ because the token that pushes this repo lacks the
# `workflow` scope GitHub requires to add files under .github/workflows/. To enable it:
#   git mv android/ci/android.yml .github/workflows/android.yml   (with a token that has `workflow` scope)
# It runs the JVM tests, lint, builds the debug APK and proves the merged manifest has no INTERNET permission.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept SDK licenses (AGP installs platform 37 on demand)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests (engine, JVM)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prove there is no INTERNET permission
        run: |
          # The manifest's own comment names the permission, so match the element rather than the string.
          ! grep -qE '<uses-permission[^>]*android\.permission\.INTERNET' app/build/intermediates/merged_manifest/debug/*/AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: clashfit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
