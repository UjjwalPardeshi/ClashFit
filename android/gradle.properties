# Memory is capped deliberately: this builds on a laptop that also runs the camera pipeline
# in an emulator. Raise -Xmx only if the build machine has headroom.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 bundles its own Kotlin compilation. We keep the standalone Kotlin Gradle plugin (and its
# DSL) until the built-in path is the only one; AGP documents this opt-out through AGP 10.
android.builtInKotlin=false

# AGP 9 ships a new DSL that refuses the standalone Kotlin plugin; we keep KGP 2.3.21 (Compose/serialization/KSP versions stay ours).
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
